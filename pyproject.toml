[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "byubit"
version = "0.8.4"
description = "A library for teaching beginners how to program"
authors = [{ name = "Gordon Bean", email = "gbean@cs.byu.edu" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = ["tracecode>=0.1.2", "webcolors>=24.8.0"]

[dependency-groups]
dev = [
    "myteam>=0.3.21",
    "numpy",
    "pytest>=8.3.2",
    "rosters",
]

[tool.hatch.build.targets.wheel]
packages = ["byubit"]

[tool.uv.sources]
rosters = { path = "../rosters", editable = true }
tracecode = { path = "../tracecode", editable = true }
