[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "byubit"
version = "0.8.4"
description = "A library for teaching beginners how to program"
authors = [{ name = "Gordon Bean", email = "gbean@cs.byu.edu" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = ["webcolors>=24.8.0"]

[dependency-groups]
dev = ["numpy", "pytest>=8.3.2"]

[tool.hatch.build.targets.wheel]
packages = ["byubit"]
